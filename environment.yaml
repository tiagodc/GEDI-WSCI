name: gedi_wsci
channels:
  - conda-forge
  - nodefaults
dependencies:
  # R runtime
  - r-base

  # R packages used by als_ce_xyz.R
  - r-getopt
  - r-future
  - r-future.apply
  - r-magrittr
  - r-data.table
  - r-wk
  - r-sf
  - r-terra
  - r-lidr
  - r-nabor
  - r-ks
  - r-trend
  - r-glue

  # Needed to install TreeLS from GitHub (not packaged on conda-forge):
  #   R -e 'remotes::install_github("tiagodc/TreeLS")'
  - r-remotes

  # Python runtime and packages used by gedi_wsci.py
  - python
  - numpy
  - pandas=2.1.3
  - xgboost=1.7.4
  - dill=0.3.6
  - crepes=0.6.1
  - pynndescent=0.5.10
